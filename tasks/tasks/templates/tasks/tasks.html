<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
</head>
<body>
    <h1>Список задач!</h1>
    {% if tasks %}
        <p>У вас есть следующие задачи:</p>
        {% for task in tasks %}
            <p>
                {{forloop.counter}}. {{task.title}} 
                {% if task.completed %}
                    [✅]
                {% else %}
                    [❌]
                {% endif %}
                (Приоритет: {{task.priority}})
            </p>
        {% endfor %}
    {% else %}
        <p>У вас нет задач!</p>
    {% endif %}
    
</body>
</html>
