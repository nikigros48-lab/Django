<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Info</title>
</head>
<body>
    <h1>Информация о задаче "{{ task.title }}"</h1>
    <p>Приоритет: {{ task.priority }}</p>
    <p>Статус: {% if task.completed %}Завершена{% else %}Незавершена{% endif %}</p>
    <a href="/tasks/{{ task.id}}/complete">Завершить задачу</a><br>
    <a href="/tasks/{{ task.id }}/delete/">Удалить задачу</a><br>
    <a href="/tasks/">Назад к списку задач</a>
</body>
</html>
