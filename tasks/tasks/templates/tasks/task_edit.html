{% extends "base.html" %}

{% block title %}Редактирование задачи{% endblock title %}

{% block content %}
    <h1>Редактирование задачи {{ task.title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
        <a href="{% url 'get_task' task.id %}" style="display: inline-block; background: #f0f0f0; border: 1px solid #a0a0a0; border-radius: 0; color: #000; text-decoration: none; padding: 2px 6px; font: 13.33px Arial, sans-serif; text-align: center; cursor: default; appearance: none; -webkit-appearance: none;">Отмена</a>
    </form>
{% endblock content %}
