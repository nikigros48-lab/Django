{% extends "base.html" %}

{% block title %}Создание задачи{% endblock %}

{% block header %}Создание задачи{% endblock %}

{% block content %}

        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Создать задачу</button>
    </form>
{% endblock %}
