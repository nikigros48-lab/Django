{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block header %}Добро пожаловать на {{ title }}!{% endblock %}

{% block content %}
    <p>{{ description }}</p>
    {% if not user.is_authenticated %}
        <a href="{% url 'login' %}" class="btn">Авторизация</a>
        <a href="{% url 'register' %}" class="btn">Регистрация</a>
    {% else %}
        <a href="{% url 'task_list' %}" class="btn">Мои задачи</a>
    {% endif %}
{% endblock %}
